services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: absassistant
      POSTGRES_USER: abs
      POSTGRES_PASSWORD: abs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abs -d absassistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_CONN: postgresql+psycopg://abs:abs@db:5432/absassistant
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
